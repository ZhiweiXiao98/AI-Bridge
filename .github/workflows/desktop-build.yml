name: Desktop remote-client build

on:
  workflow_dispatch:
  push:
    paths: ['app/**', 'boot_remote.py', 'requirements-desktop-build.txt', 'tools/desktop/**', 'tests/public_ci/test_desktop_packaging.py', '.github/workflows/desktop-build.yml']
  pull_request:
    paths: ['app/**', 'boot_remote.py', 'requirements-desktop-build.txt', 'tools/desktop/**', 'tests/public_ci/test_desktop_packaging.py', '.github/workflows/desktop-build.yml']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unsigned remote client / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install isolated remote-client build dependencies
        run: python -m pip install -r requirements-desktop-build.txt
      - name: Test packaging safety contracts
        run: python -m unittest discover -s tests/public_ci -p test_desktop_packaging.py -v
      - name: Build remote client and collect dependency notices
        run: python tools/desktop/build.py
      - name: Smoke-test frozen login window
        run: python tools/desktop/smoke.py
      # Do not upload dist/ or dependency binaries until exact Qt/dependency
      # notices, corresponding source and replace/relink requirements are reviewed.
      # There is deliberately no user-controlled switch bypassing this gate.
      - name: Upload build inventory only (no executable)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AI-Bridge-Remote-UNSIGNED-review-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: build/desktop/review/desktop-inventory.json
          if-no-files-found: error
          retention-days: 7

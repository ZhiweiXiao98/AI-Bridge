name: 本人本地Mac测试包（限定加密交付）

# 仅发布负责人审查后的独立一次性分支；不得合入默认分支或绕过材料审批。
on:
  push:
    branches: ['feature/owner-local-macos-test-20261002']
    paths: ['.github/workflows/owner-local-macos-test.yml', 'tools/owner-local-test/**']
permissions:
  contents: read
concurrency:
  group: owner-local-macos-test-20261002
  cancel-in-progress: false
jobs:
  owner-test:
    # 发布负责人先在精确源码创建独立分支，再只前进一次到经审查的配方提交。
    # 重跑或后续 push 的 before 不再匹配；不得强推回滚来重复交付。
    if: >-
      github.event_name == 'push' &&
      github.repository == 'ZhiweiXiao98/AI-Bridge' &&
      github.actor == 'ZhiweiXiao98' &&
      github.ref == 'refs/heads/feature/owner-local-macos-test-20261002' &&
      github.event.before == '887594cacc6de1c6baa204e8157de000d31f4506' &&
      github.run_attempt == '1' &&
      github.event.forced == false && github.event.deleted == false &&
      github.event.after == github.sha
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: source
        shell: bash
    env:
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      ANONYMIZED_TELEMETRY: 'False'
    steps:
      - name: 检出经审查的精确应用源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 887594cacc6de1c6baa204e8157de000d31f4506
          path: source
          persist-credentials: false
      - name: 检出本次独立配方和新公钥（不含私钥）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: 配置固定ARM64 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: arm64
      - name: 创建一次性构建环境
        run: |
          test "$(uname -m)" = arm64
          python -m venv .owner-local-venv
          echo "$PWD/.owner-local-venv/bin" >> "$GITHUB_PATH"
          mkdir -p build/local-desktop
      - name: 安装固定构建依赖并核验范围
        run: |
          python -m pip install --only-binary=:all: --report build/local-desktop/install-report.json -r requirements-desktop-local-build.txt
          python -m pip check
          python tools/check_public_tree.py
          python -m unittest discover -s tests/public_ci -p 'test_local_desktop*.py' -v
      - name: 重建并核验精确批准的源码与许可材料
        run: |
          BASE="$(pwd -P)"
          RECIPE="$(cd ../recipe && pwd -P)"
          python "$RECIPE/tools/owner-local-test/rehydrate_owner_materials.py" --manifest "$RECIPE/tools/owner-local-test/materials-inputs/index.json" --output "$BASE/build/owner-approved-materials"
          python -c "import sys; from pathlib import Path; sys.path.insert(0, '../recipe/tools/owner-local-test'); from package_local import require_materials, SOURCE_COMMIT; require_materials(Path('build/owner-approved-materials/materials-review.json'), SOURCE_COMMIT)"
      - name: 固定测试浏览器（不随包）与完整应用构建
        run: |
          python tools/desktop/local_browser_fixture.py --output build/local-desktop/browser-test
          env GITHUB_SHA=887594cacc6de1c6baa204e8157de000d31f4506 python tools/desktop/local_build.py
          python tools/desktop/local_smoke.py --browser-fixture build/local-desktop/browser-test/runtime.json
      - name: 材料审批门槛和只读最终DMG完整验收
        run: python ../recipe/tools/owner-local-test/package_local.py --materials build/owner-approved-materials/materials-review.json
      - name: 建立独立加密工具环境（不加入应用）
        run: |
          python -m venv .delivery-venv
          .delivery-venv/bin/python -m pip install --index-url https://pypi.org/simple --only-binary=:all: cryptography==50.0.0 cffi==2.1.1 pycparser==3.0
      - name: 固定新公钥与完整验证摘要的流式加密
        id: seal
        run: |
          BASE="$(pwd -P)"
          RECIPE="$(cd ../recipe && pwd -P)"
          .delivery-venv/bin/python "$RECIPE/tools/owner-local-test/seal_local.py" --archive "$BASE/build/owner-local-test/AI-Bridge-Local-macOS-ARM64-owner-test.dmg" --public-key "$RECIPE/tools/owner-local-test/recipient-public.pub" --validation "$BASE/build/owner-local-test/owner-package-validation.json" --output "$BASE/build/owner-local-test/sealed" --workflow-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          .delivery-venv/bin/python "$RECIPE/tools/owner-local-test/verify_upload_list.py" --sealed "$BASE/build/owner-local-test/sealed" --validation "$BASE/build/owner-local-test/owner-package-validation.json" --workflow-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: 仅上传加密分片 001
        if: ${{ success() && fromJSON(steps.seal.outputs.part_count) >= 1 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-local-cipher-001-${{ github.sha }}
          path: |
            source/build/owner-local-test/sealed/owner-test.part001.aesgcm
            source/build/owner-local-test/sealed/owner-test-envelope.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: 仅上传加密分片 002
        if: ${{ success() && fromJSON(steps.seal.outputs.part_count) >= 2 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:

name: 公开源码安全检查

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-safety:
    name: 公开源码安全检查（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 配置 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 检查已跟踪文件的公开发布边界
        run: python tools/check_public_tree.py
      - name: 运行离线认证与公开发布回归测试
        run: python -m unittest discover -s tests/public_ci -v
      - name: 检查 Python 语法（不导入应用代码）
        run: python -m compileall -q app tests server.py boot_remote.py start_client.py start_server.py

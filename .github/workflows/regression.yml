name: 应用离线回归测试

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: 离线回归 / ${{ matrix.label }}（Python 3.12）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            label: 核心逻辑
            markers: not ui and not docker and not slow and not benchmark and not model and not external
          - group: ui
            label: 无界面渲染
            markers: ui and not docker and not slow and not benchmark and not model and not external
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      ANONYMIZED_TELEMETRY: 'False'
      DOCKER_HOST: tcp://127.0.0.1:1
      PYTHONUTF8: '1'
    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 配置 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements.lock
      - name: 安装 Qt 运行库
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: 安装版本受约束的测试依赖
        run: python -m pip install -r requirements-ci.txt
      - name: 检查 Python 代码错误
        if: matrix.group == 'core'
        run: python -m ruff check app tests --select E9,F63,F7,F82
      - name: 在网络阻断下运行回归测试
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken
        run: python -m pytest tests --disable-socket --allow-unix-socket -m "${{ matrix.markers }}"

  pi-contract:
    name: 固定版本 Pi SDK 合约测试（离线模拟模型服务）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 配置 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
      - name: 安装固定版本 Pi 依赖（不运行安装脚本）
        working-directory: runtime/pi
        run: npm ci --ignore-scripts
      - name: 使用确定性模拟模型服务验证 SDK
        working-directory: runtime/pi
        run: npm run check && npm test
      - name: 运行 Python 子进程合约测试
        run: |
          python -m pip install pytest==9.0.3 pytest-socket==0.7.0
          python -m pytest tests/test_agent_runtime.py --disable-socket --allow-unix-socket -o addopts=''

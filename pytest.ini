[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs =
    .git
    .venv
    backup
    htmlcov
    __pycache__
    .pytest_cache

# Test output
addopts =
    -v
    --tb=short
    -m "not benchmark and not slow"
    --strict-markers
    --disable-warnings
    -p no:cacheprovider

# Marks
markers =
    docker: tests that require Docker
    ui: tests that require a UI environment
    slow: slow tests
    integration: integration tests
    benchmark: retrieval quality benchmark tests, run explicitly

[coverage:run]
source = app
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
